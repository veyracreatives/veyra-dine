<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Veyra Academy HQ</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B5EAA">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
[hidden]{display:none!important}
.hq-badge{font:700 10.5px/1 var(--f-mono);letter-spacing:.12em;padding:4px 7px;border-radius:6px;background:var(--gold-grad);color:var(--brand-ink)}
.keybox{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px;border-radius:14px;background:var(--panel-hi);border:1px solid var(--brand);box-shadow:var(--glow)}
.keybox code{font:700 clamp(16px,3.4vw,24px)/1.2 var(--f-mono);letter-spacing:.06em;color:var(--brand);word-break:break-all}
.lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lock form{width:min(400px,100%);display:grid;gap:18px;padding:28px;border-radius:20px;background:var(--surface);border:1px solid color-mix(in srgb,var(--brand) 40%,transparent);box-shadow:var(--glow)}
.disp{font-family:var(--f-display);font-weight:900;font-stretch:72%;text-transform:uppercase;line-height:.95}
.disp em{font-family:var(--f-serif);font-style:italic;font-weight:400;text-transform:none;font-stretch:normal;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.lock .mk{width:40px;height:40px}
.err{color:var(--bad);font-size:13.5px;font-weight:600}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.set-row{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px 24px;padding:20px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row h4{font-size:15px;font-family:var(--f-body);font-weight:700}
.set-row p{font-size:13px;color:var(--ink-3);margin-top:4px}
.set-row .f{display:grid;gap:12px;min-width:0}
.copyline{display:flex;gap:8px;align-items:center;min-width:0}
.copyline code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 12.5px/1.4 var(--f-mono);padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.ok-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
.no-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line-2);margin-right:6px;vertical-align:middle}
.act-row{display:flex;gap:12px;align-items:flex-start;padding:12px 20px;border-bottom:1px solid var(--line);font-size:14px}
.act-row time{flex:none;width:120px;color:var(--ink-3);font:500 12px/1.6 var(--f-mono)}
.demo-strip{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 16px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:600;text-align:center}
.more-list{display:grid}
.more-list a{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600;cursor:pointer}
.more-list a svg{width:20px;height:20px;color:var(--ink-3)}
.hb{display:grid;gap:12px}
.hb-l{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:6px;min-width:0}
.hb-l span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-l b{flex:none;font-weight:700}.hb-l b small{font-weight:500;color:var(--ink-3)}
.hb-t{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.spk{display:grid;gap:8px}.spk-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}.spk-top b{color:var(--ink)}.spk-ax{display:flex;justify-content:space-between;font:500 11px var(--f-mono);color:var(--ink-3)}
.spark{width:100%;height:150px;display:block}.spark .dash{stroke-dasharray:4 4}
.spark .ax{stroke:var(--line);stroke-width:1}.spark .ln{fill:none;stroke:var(--brand);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.spark .ar{fill:var(--brand);opacity:.09}.spark .pt{fill:var(--surface);stroke:var(--brand);stroke-width:2;vector-effect:non-scaling-stroke}
.spark text{font:500 10.5px var(--f-mono);fill:var(--ink-3)}
.fun{display:grid;gap:14px}
.fun-r{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:14px;align-items:center}
.fun-l{display:flex;gap:10px;align-items:center;min-width:0;font-size:14px}.fun-l b{font-weight:600;min-width:0}
.fun-i{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font:700 12px var(--f-mono)}
.fun-bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}.fun-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:inherit}
.fun-n{display:grid;justify-items:end;width:150px}.fun-n b{font-size:17px}.fun-n small{font-size:11.5px;color:var(--ink-3);white-space:nowrap}.lost{color:var(--bad)}
.rate{display:grid;grid-template-columns:minmax(70px,1fr) 38px;gap:8px;align-items:center;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
tr.click{cursor:pointer}
.ck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px;padding:6px 20px 16px}
.ck-r{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;min-width:0}.ck-r>div{min-width:0}
.ck-r small{display:block;color:var(--ink-3);font-size:12px;overflow-wrap:anywhere}
.ck-i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--f-body)}.ck-i svg{width:13px;height:13px}
.ck-r.ok .ck-i{background:var(--ok-soft);color:var(--ok)}.ck-r.warn .ck-i{background:var(--warn-soft);color:var(--warn)}.ck-r.bad .ck-i{background:var(--bad-soft);color:var(--bad)}
.sring{position:relative;width:64px;display:grid;justify-items:center;gap:4px;flex:none}.sring svg{width:56px;height:56px;transform:rotate(-90deg)}
.sring circle{fill:none;stroke-width:3.2;stroke-linecap:round}.sring .bg{stroke:var(--surface-2)}
.sring b{position:absolute;top:0;height:56px;display:grid;place-items:center;font:800 17px var(--f-body)}.sring small{font-size:11px;color:var(--ink-3);text-align:center;line-height:1.2}
.rings{display:flex;gap:10px;flex-wrap:wrap}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:14px}.steps li{display:flex;gap:12px;align-items:flex-start}.steps p{font-size:13.5px;color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere}
.stp{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font:700 12.5px var(--f-mono)}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi.mini{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}.kpi.mini .v{font-size:22px}
.fixes{margin:10px 0 0;padding-left:0;list-style:none;display:grid;gap:8px;font-size:13px}
.card-h h3 svg{width:18px;height:18px;vertical-align:-3px;margin-right:4px;color:var(--brand)}
code{font:500 12px var(--f-mono);background:var(--surface-2);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
.only-sm{display:none!important}
.card-b .divider{margin:18px 0 14px}.card-b .divider+.label{display:block;margin-bottom:10px}
@media (max-width:1100px){.hide-md{display:none}}
@media (min-width:901px) and (max-width:1240px){.hide-lg{display:none}}
@media (max-width:900px){.ck{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.only-sm{display:block!important}.fun-r{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}.fun-bar{grid-column:1/-1;grid-row:2}.fun-n{width:auto}.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis.k3{grid-template-columns:minmax(0,1fr)}.ck{padding:4px 16px 12px}.spark{height:120px}}
@media (max-width:420px){.seg button{padding:0 10px}}
.only-xs{display:none}.xs-in{display:none}@media (max-width:560px){.xs-in{display:inline}}
@media (max-width:560px){.only-xs{display:block}.hide-xs{display:none}}
@media (max-width:720px){.set-row{grid-template-columns:minmax(0,1fr);padding:16px}.act-row{flex-direction:column;gap:2px;padding:12px 16px}.act-row time{width:auto}}
</style>
<!--CFG-->
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="core.js"></script>
<script src="icons.js"></script>
<script src="hq.js"></script>
</body>
</html>
