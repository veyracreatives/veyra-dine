<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Print table QR cards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/assets/base.css">
<style>
  body { background: #E7E5E1; }
  .bar { position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bar h1 { margin: 0; font-size: 18px; }
  .sheet-a4 { width: 210mm; min-height: 297mm; margin: 20px auto; background: #fff; padding: 10mm; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 133mm; gap: 6mm; box-shadow: 0 4px 20px rgba(0,0,0,.12); }
  .card { border: 1px dashed #CFCAC3; border-radius: 6mm; overflow: hidden; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .band { width: 100%; background: var(--brand); color: var(--on-brand); padding: 6mm 5mm 5mm; display: flex; align-items: center; justify-content: center; gap: 3mm; }
  .band img { width: 13mm; height: 13mm; border-radius: 3mm; object-fit: cover; background: #fff; }
  .band b { font-size: 5.2mm; line-height: 1.15; text-align: left; }
  .scan { margin: 5mm 0 2mm; font-weight: 800; font-size: 5mm; }
  .sub { color: #57534E; font-size: 3.4mm; margin-bottom: 3mm; }
  .qr { width: 52mm; height: 52mm; }
  .qr svg { width: 100%; height: 100%; }
  .tbl { margin-top: 3mm; font-size: 8mm; font-weight: 800; letter-spacing: -.02em; }
  .foot { margin-top: auto; padding: 3mm 0 4mm; font-size: 3mm; color: #8A8580; display: flex; gap: 3mm; align-items: center; }
  @media print {
    body { background: #fff; }
    .bar { display: none; }
    .sheet-a4 { margin: 0; box-shadow: none; page-break-after: always; }
    @page { size: A4; margin: 0; }
  }
</style>
</head>
<body>
<div class="bar"><div><h1>Table QR cards</h1><span class="muted" style="font-size:14px">4 cards per A4 page. Cut along the dashed lines.</span></div><button class="btn btn-primary" onclick="print()">Print</button></div>
<div id="pages"></div>
<script src="/assets/icons.js"></script>
<script>
(async () => {
  const get = p => fetch(p, { credentials: 'same-origin' }).then(r => { if (!r.ok) throw new Error('Please log in to the admin first.'); return r.json(); });
  try {
    const [me, tables] = await Promise.all([get('/api/admin/me'), get('/api/admin/tables')]);
    const r = me.restaurant; applyBrand(r.brandColor);
    const handle = r.socials.instagram ? r.socials.instagram.replace(/[?#].*$/, '').replace(/\/$/, '').split('/').pop() : '';
    const ig = handle && !handle.includes('.') ? '@' + handle : '';
    const cards = tables.filter(t => t.active).map(t => `<div class="card">
      <div class="band">${r.logo ? `<img src="${esc(r.logo)}" alt="">` : ''}<b>${esc(r.name)}</b></div>
      <div class="scan">Scan to order</div><div class="sub">Open your camera and point it at the code</div>
      <div class="qr">${t.qr}</div>
      <div class="tbl">${esc(t.name)}</div>
      <div class="foot">${ig && ig !== '@' ? icon('instagram', 12) + ' ' + esc(ig) : ''}</div></div>`);
    let html = '';
    for (let i = 0; i < cards.length; i += 4) html += `<div class="sheet-a4">${cards.slice(i, i + 4).join('')}</div>`;
    document.getElementById('pages').innerHTML = html || '<p class="empty">No tables yet.</p>';
  } catch (e) { document.getElementById('pages').innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
})();
</script>
</body>
</html>
