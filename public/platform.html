<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Veyra Dine In · Platform</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/admin.css">
<style>
  :root { --brand: #0B0B0C; --on-brand: #fff; --brand-soft: #F1EDE4; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 20px 60px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .head h1 { margin: 0; font-size: 26px; }
  .gold { color: #8A6A2F; }
  .rlist { display: grid; gap: 12px; }
  .rrow { display: flex; align-items: center; gap: 16px; padding: 16px; background: #fff; border: 1px solid var(--line); border-radius: 16px; flex-wrap: wrap; }
  .rrow .lg { width: 52px; height: 52px; border-radius: 14px; background: var(--bg); overflow: hidden; display: grid; place-items: center; font-weight: 800; flex: none; }
  .rrow .lg img { width: 100%; height: 100%; object-fit: cover; }
  .rrow .grow { flex: 1; min-width: 180px; }
  .rrow .grow small { color: var(--ink-3); }
  .nums { display: flex; gap: 18px; font-size: 13px; color: var(--ink-2); }
  .nums b { display: block; font-size: 17px; color: var(--ink); }
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<script src="/assets/icons.js"></script>
<script>
(function () {
  const app = document.getElementById('app');
  const toast = (m, t = '') => { const e = document.createElement('div'); e.className = 'toast ' + t; e.innerHTML = m; document.getElementById('toasts').appendChild(e); setTimeout(() => e.remove(), 3500); };
  async function api(p, o = {}) {
    const r = await fetch(p, { headers: { 'Content-Type': 'application/json' }, ...o, body: o.body ? JSON.stringify(o.body) : undefined });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401 && !p.endsWith('/login')) { login(); throw new Error('Please log in'); }
    if (!r.ok) throw new Error(d.error || 'Something went wrong'); return d;
  }
  function modal(html) { const o = document.createElement('div'); o.className = 'overlay center'; o.innerHTML = `<div class="sheet">${html}</div>`; o.onclick = e => { if (e.target === o || e.target.closest('[data-close]')) o.remove(); }; document.body.appendChild(o); return o; }
  function login() {
    app.innerHTML = `<div class="login"><form class="login-card" id="f"><div class="lg">${icon('store', 28)}</div><h1>Veyra platform</h1><p class="muted" style="margin:0 0 20px">Add restaurants and manage their logins.</p>
      <div class="form"><label class="field"><span>Platform password</span><input class="input" type="password" name="p" required></label><button class="btn btn-primary btn-lg btn-block">Log in</button></div>
      <p class="muted" style="font-size:13px;margin-top:16px">Forgot the password? Open your server in hPanel › Browser terminal to see it or make a new one.</p></form></div>`;
    document.getElementById('f').onsubmit = async e => { e.preventDefault(); try { await api('/api/platform/login', { method: 'POST', body: { password: new FormData(e.target).get('p') } }); list(); } catch (err) { toast(esc(err.message), 'error'); } };
  }
  const planBadge = a => a.plan === 'lifetime' ? '<span class="badge badge-green">Lifetime</span>' : a.active ? `<span class="badge ${a.plan === 'trial' ? 'badge-amber' : 'badge-blue'}">${a.plan === 'trial' ? 'Trial' : a.plan === 'monthly' ? 'Monthly' : 'Yearly'} · ${a.daysLeft} days left</span>` : `<span class="badge badge-red">${a.plan === 'trial' ? 'Trial ended' : 'Expired'}</span>`;
  async function list() {
    const rs = await api('/api/platform/restaurants');
    app.innerHTML = `<div class="wrap"><div class="head"><div><h1>Restaurants <span class="gold">· ${rs.length}</span></h1><span class="muted">Every restaurant gets its own menu, admin login, tables and branding.</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="pays">Payments</button><button class="btn" id="rzp">Online payments</button><button class="btn" id="gg">Google sign-in</button><button class="btn" id="em">Email codes</button><button class="btn" id="pw">${icon('lock', 18)} Platform password</button><button class="btn btn-primary" id="add">${icon('plus', 18)} Add restaurant</button></div></div>
      <div class="rlist">${rs.map(r => `<div class="rrow"><div class="lg" style="color:${r.brandColor}">${r.logo ? `<img src="${esc(r.logo)}" alt="">` : esc(r.name[0])}</div>
        <div class="grow"><b>${esc(r.name)}</b> ${planBadge(r.access)}<br><small>ID: ${esc(r.slug)}${r.email ? ' · ' + esc(r.email) : ''}${r.ownerPhone ? ' · ' + esc(r.ownerPhone) : ''} · added ${new Date(r.createdAt).toLocaleDateString()}</small></div>
        <div class="nums"><span><b>${r.tables}</b>tables</span><span><b>${r.items}</b>dishes</span><span><b>${r.orders}</b>orders</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-sm" href="/m/${r.slug}" target="_blank">${icon('eye', 16)} Menu</a><a class="btn btn-sm" href="/admin/${r.slug}" target="_blank">${icon('settings', 16)} Admin</a>${r.access.plan === 'trial' ? `<button class="btn btn-sm" data-extend="${r.id}">+7 days trial</button>` : ''}<button class="btn btn-sm" data-paid="${r.id}" data-name="${esc(r.name)}" data-plan="${r.access.plan}">${r.access.plan === 'lifetime' ? 'Renew updates' : 'Mark as paid'}</button><button class="btn btn-sm" data-reset="${r.id}" data-name="${esc(r.name)}">${icon('lock', 16)} Reset password</button>
        <label class="switch" title="Show “Powered by Veyra Dine In” at the bottom of the menu"><input type="checkbox" data-pb="${r.id}" ${r.poweredBy ? 'checked' : ''}><span class="track"></span><span style="font-size:13px">Veyra credit</span></label></div></div>`).join('') || '<div class="empty">No restaurants yet.</div>'}</div></div>`;
    document.getElementById('add').onclick = () => {
      const o = modal(`<form><div class="sheet-head"><h3>Add a restaurant</h3><button type="button" class="icon-btn" data-close>${icon('x', 20)}</button></div><div class="sheet-body form">
        <label class="field"><span>Restaurant name</span><input class="input" name="name" required></label>
        <label class="field"><span>Restaurant ID (for login and the menu link)</span><input class="input" name="slug" placeholder="made from the name if empty"></label>
        <label class="field"><span>Admin password for the restaurant</span><input class="input" name="password" minlength="6" required><small>Share it with the owner. They can change it later.</small></label></div>
        <div class="sheet-foot"><button class="btn btn-primary btn-lg btn-block">Create restaurant</button></div></form>`);
      o.querySelector('form').onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target); try { const r = await api('/api/platform/restaurants', { method: 'POST', body: Object.fromEntries(f) }); o.remove(); toast(`Created. Login ID: <b>${esc(r.slug)}</b>`, 'ok'); list(); } catch (err) { toast(esc(err.message), 'error'); } };
    };
    document.getElementById('gg').onclick = async () => {
      const cur = await api('/api/platform/google').catch(() => ({ clientId: '' }));
      const o = modal(`<form><div class="sheet-head"><h3>Sign in with Google</h3><button type="button" class="icon-btn" data-close>${icon('x', 20)}</button></div><div class="sheet-body"><p class="muted" style="margin-top:0">Paste the Client ID from Google Cloud. It ends with .apps.googleusercontent.com. Leave it empty to turn Google sign-in off.</p><label class="field"><span>Google Client ID</span><input class="input" name="clientId" value="${esc(cur.clientId || '')}" placeholder="1234567890-abc123.apps.googleusercontent.com" spellcheck="false"></label><button class="btn btn-primary btn-block">Save</button></div></form>`);
      o.querySelector('form').onsubmit = async e => { e.preventDefault(); try { const r = await api('/api/platform/google', { method: 'POST', body: { clientId: new FormData(e.target).get('clientId').trim() } }); o.remove(); toast(r.clientId ? 'Google sign-in is on' : 'Google sign-in is off', 'ok'); } catch (err) { toast(esc(err.message), 'error'); } };
    };
    document.getElementById('em').onclick = async () => {
      const c = await api('/api/platform/email').catch(() => ({}));
      const o = modal(`<form><div class="sheet-head"><h3>Email codes for password reset</h3><button type="button" class="icon-btn" data-close>${icon('x', 20)}</button></div><div class="sheet-body">
        <p class="muted" style="margin-top:0">Restaurants who forget their password get a 6-digit code by email. For Gmail: turn on 2-Step Verification, then make an App password at myaccount.google.com/apppasswords and paste it here. Leave the server empty to turn email codes off.</p>
        <div class="form">
          <div class="row2"><label class="field"><span>Email server</span><input class="input" name="host" value="${esc(c.host || '')}" placeholder="smtp.gmail.com"></label>
            <label class="field"><span>Port</span><input class="input" name="port" type="number" value="${esc(c.port || 465)}"></label></div>
          <label class="field"><span>Email address</span><input class="input" name="user" type="email" value="${esc(c.user || '')}" placeholder="you@gmail.com"></label>
          <label class="field"><span>App password</span><input class="input" name="pass" type="password" autocomplete="new-password" placeholder="${c.hasPass ? 'Saved. Type only to change it' : '16 letters from Google'}"></label>
          <label class="field"><span>Sender name shown in the email</span><input class="input" name="from" value="${esc(c.from || '')}" placeholder="Veyra Dine In &lt;you@gmail.com&gt;"></label>
          <label class="field"><span>Send a test email to</span><input class="input" name="test" type="email" placeholder="optional"></label>
        </div>${c.fromEnv ? '<p class="muted">Settings from the server environment are used first.</p>' : ''}</div>
        <div class="sheet-foot"><button class="btn btn-primary btn-lg btn-block">Save</button></div></form>`);
      o.querySelector('form').onsubmit = async e => { e.preventDefault(); const b = e.target.querySelector('.sheet-foot button'); b.disabled = true; try { const r = await api('/api/platform/email', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) }); o.remove(); toast(r.off ? 'Email codes are off' : 'Saved. Email codes are on', 'ok'); } catch (err) { toast(esc(err.message), 'error'); b.disabled = false; } };
    };
    document.getElementById('pw').onclick = () => {
      const o = modal(`<form><div class="sheet-head"><h3>Change platform password</h3><button type="button" class="icon-btn" data-close>${icon('x', 20)}</button></div><div class="sheet-body"><label class="field"><span>New password</span><input class="input" type="password" name="next" minlength="8" required></label></div><div class="sheet-foot"><button class="btn btn-primary btn-lg btn-block">Save</button></div></form>`);
      o.querySelector('form').onsubmit = async e => { e.preventDefault(); try { await api('/api/platform/password', { method: 'POST', body: { next: new FormData(e.target).get('next') } }); o.remove(); toast('Password changed', 'ok'); } catch (err) { toast(esc(err.message), 'error'); } };
    };
    app.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => {
      const o = modal(`<form><div class="sheet-head"><h3>New password for ${b.dataset.name}</h3><button type="button" class="icon-btn" data-close>${icon('x', 20)}</button></div><div class="sheet-body"><label class="field"><span>New password</span><input class="input" name="password" minlength="6" required></label></div><div class="sheet-foot"><button class="btn btn-primary btn-lg btn-block">Set password</button></div></form>`);
      o.querySelector('form').onsubmit = async e => { e.preventDefault(); try { await api(`/api/platform/restaurants/${b.dataset.reset}/password`, { method: 'POST', body: { password: new FormData(e.target).get('password') } }); o.remove(); toast('Password updated', 'ok'); } catch (err) { toast(esc(err.message), 'error'); } };
    });
    app.querySelectorAll('[data-extend]').forEach(b => b.onclick = async () => { await api('/api/platform/restaurants/' + b.dataset.extend, { method: 'PUT', body: { extendTrialDays: 7 } }); toast('Trial extended by 7 days', 'ok'); list(); });
    app.querySelectorAll('[data-paid]').forEach(b => b.onclick = async () => { // payment taken by hand: UPI, cash, bank transfer
      const cfg = await api('/api/platform/razorpay').catch(() => ({ prices: {} })), P = cfg.prices || {};
      const life = b.dataset.plan === 'lifetime';
      const opts = (life ? [['updates', 'Update renewal (1 year)']] : [['monthly', 'Monthly'], ['yearly', 'Yearly'], ['lifetime', 'Lifetime']]).map(([k, l]) => `<option value="${k}" data-price="${P[k] || ''}">${l}${P[k] ? ' · ₹' + Number(P[k]).toLocaleString('en-IN') : ''}</option>`).join('');
      const o = modal(`<form><div class="sheet-head"><h3>Mark ${esc(b.dataset.name)} as paid</h3><button type="button" class="icon-btn" data-close>${icon('x', 20)}</button></div><div class="sheet-body form">
        <p class="muted" style="margin:0">For money you took by UPI, cash or bank transfer. The plan starts now (paying early adds on to the end) and the owner gets a receipt email. No license key is needed.</p>
        <label class="field"><span>Plan</span><select class="input" name="plan">${opts}</select></label>
        <div class="row2"><label class="field"><span>Amount received (₹)</span><input class="input" name="amount" type="number" min="0" step="1"></label>
          <label class="field"><span>Paid by</span><select class="input" name="method"><option value="upi">UPI</option><option value="bank transfer">Bank transfer</option><option value="cash">Cash</option><option value="cheque">Cheque</option><option value="other">Other</option></select></label></div>
        <label class="field"><span>Reference (UTR or note, optional)</span><input class="input" name="reference" maxlength="80"></label></div>
        <div class="sheet-foot"><button class="btn btn-primary btn-lg btn-block">Mark as paid</button></div></form>`);
      const sel = o.querySelector('[name=plan]'), amt = o.querySelector('[name=amount]');
      const fill = () => { amt.value = sel.selectedOptions[0].dataset.price || ''; }; sel.onchange = fill; fill();
      o.querySelector('form').onsubmit = async e => { e.preventDefault(); const btn = e.target.querySelector('.sheet-foot button'); btn.disabled = true;
        try { const r = await api('/api/platform/restaurants/' + b.dataset.paid + '/payment', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) }); o.remove(); toast(`Marked as paid · ${esc(r.payment.receipt)}${r.emailed ? ' · receipt emailed' : ''}`, 'ok'); list(); }
        catch (err) { btn.disabled = false; toast(esc(err.message), 'error'); } };
    });
    document.getElementById('rzp').onclick = async () => {
      const c = await api('/api/platform/razorpay').catch(() => ({}));
      const o = modal(`<form><div class="sheet-head"><h3>Online payments (Razorpay)</h3><button type="button" class="icon-btn" data-close>${icon('x', 20)}</button></div><div class="sheet-body">
        <p class="muted" style="margin-top:0">Restaurants buy Monthly, Yearly, Lifetime and update renewal with Razorpay, and their plan starts by itself. Only for plans: guests still pay bills to the restaurant's own UPI. Get the keys in Razorpay › Account &amp; Settings › API keys. Start with Test mode keys (rzp_test_…), then switch to Live keys. Leave the Key ID empty to turn online payment off.</p>
        ${c.mode ? `<p><span class="badge ${c.mode === 'live' ? 'badge-green' : 'badge-amber'}">${c.mode === 'live' ? 'Live: real payments' : 'Test mode: no real money'}</span></p>` : ''}
        <div class="form">
          <label class="field"><span>Key ID</span><input class="input" name="keyId" value="${esc(c.keyId || '')}" placeholder="rzp_test_..." autocomplete="off" spellcheck="false"></label>
          <label class="field"><span>Key Secret</span><input class="input" name="keySecret" type="password" autocomplete="new-password" placeholder="${c.hasSecret ? 'Saved. Type only to change it' : 'Shown once when you make the key'}"></label>
          <label class="field"><span>Webhook secret</span><input class="input" name="webhookSecret" type="password" autocomplete="new-password" placeholder="${c.hasWebhook ? 'Saved. Type only to change it' : 'Any long password you choose'}"></label>
          <div class="field"><span>Webhook URL (Razorpay › Account &amp; Settings › Webhooks › Add new webhook, events: payment.captured, order.paid, payment.failed)</span><div class="key-row"><input class="input" readonly value="${esc(c.webhookUrl || '')}" id="whu"><button type="button" class="btn" id="whc">${icon('copy', 18)} Copy</button></div><small>Use the same webhook secret in both places. The webhook switches the plan on even if the buyer closes the payment window.</small></div>
        </div>${c.fromEnv ? '<p class="muted">Keys from the server environment are used first.</p>' : ''}</div>
        <div class="sheet-foot" style="display:grid;gap:8px"><button class="btn btn-primary btn-lg btn-block">Check keys and save</button>${c.mode ? '<button type="button" class="btn btn-block" id="try1">Try a ₹1 payment (refunded automatically)</button>' : ''}</div></form>`);
      const t1 = o.querySelector('#try1'); if (t1) t1.onclick = async () => {
        t1.disabled = true;
        try {
          if (!window.Razorpay) await new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://checkout.razorpay.com/v1/checkout.js'; sc.onload = ok; sc.onerror = () => no(new Error('Could not load Razorpay')); document.head.appendChild(sc); });
          const ord = await api('/api/platform/razorpay/test', { method: 'POST', body: {} });
          const rz = new window.Razorpay({ key: ord.keyId, order_id: ord.orderId, amount: ord.amount, currency: ord.currency, name: ord.name, description: ord.description, theme: { color: '#E4572E' },
            handler: async resp => { try { const r = await api('/api/platform/razorpay/test', { method: 'POST', body: resp }); o.remove();
              modal(`<div class="sheet-head"><h3>Razorpay works</h3><button type="button" class="icon-btn" data-close>${icon('x', 20)}</button></div><div class="sheet-body"><p style="margin-top:0">The ₹1 payment went through and the keys are right (payment ${esc(r.paymentId)}).</p><p>${r.refunded ? 'The ₹1 has been refunded. It reaches the card or UPI account in 5 to 7 days.' : 'The automatic refund did not go through' + (r.note ? ' (' + esc(r.note) + ')' : '') + '. Refund it in Razorpay › Transactions › Payments.'}</p><p class="muted">${r.webhook ? 'Webhook secret is saved.' : 'Add the webhook next, so plans start even when a buyer closes the payment window.'}</p></div>`); }
              catch (err) { toast(esc(err.message), 'error'); } },
            modal: { ondismiss: () => { t1.disabled = false; } } });
          rz.open();
        } catch (err) { t1.disabled = false; toast(esc(err.message), 'error'); }
      };
      o.querySelector('#whc').onclick = async () => { try { await navigator.clipboard.writeText(c.webhookUrl); toast('Copied'); } catch { prompt('Webhook URL', c.webhookUrl); } };
      o.querySelector('form').onsubmit = async e => { e.preventDefault(); const btn = e.target.querySelector('.sheet-foot button'); btn.disabled = true;
        try { const r = await api('/api/platform/razorpay', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) }); o.remove(); toast(r.off ? 'Online payment is off' : r.mode === 'live' ? 'Saved. Live payments are on' : 'Saved. Test payments are on', 'ok'); }
        catch (err) { btn.disabled = false; toast(esc(err.message), 'error'); } };
    };
    document.getElementById('pays').onclick = async () => {
      const ps = await api('/api/platform/payments').catch(() => []);
      const tot = {}; ps.filter(x => x.mode !== 'test').forEach(x => { const k = (x.paidAt || '').slice(0, 7); tot[k] = (tot[k] || 0) + x.amount; });
      const inr = n => '₹' + Number(n).toLocaleString('en-IN');
      const o = modal(`<div class="sheet-head"><h3>Payments</h3><button type="button" class="icon-btn" data-close>${icon('x', 20)}</button></div><div class="sheet-body">
        ${Object.keys(tot).length ? `<div class="pay-tot">${Object.keys(tot).sort().reverse().slice(0, 6).map(k => `<div><small>${new Date(k + '-01T00:00:00').toLocaleDateString('en-IN', { month: 'short', year: 'numeric' })}</small><b>${inr(tot[k])}</b></div>`).join('')}</div>` : ''}
        ${ps.some(x => x.mode === 'test') ? '<p class="muted" style="margin:-6px 0 12px;font-size:13px">Monthly totals count real payments only, not test ones.</p>' : ''}<div class="pay-list">${ps.map(x => `<div class="pay-row"><div><b>${esc(x.restaurant)}</b> · ${esc(x.planName)}<small>${new Date(x.paidAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })} · ${esc(x.receipt)} · ${x.mode === 'manual' ? 'by hand' + (x.method ? ', ' + esc(x.method) : '') : x.mode === 'test' ? 'Razorpay test' : 'Razorpay' + (x.method ? ', ' + esc(x.method) : '')}</small></div><span class="amt">${inr(x.amount)}</span><a class="btn btn-sm" href="/receipt/${esc(x.id)}" target="_blank">Receipt</a></div>`).join('') || '<div class="empty">No payments yet.</div>'}</div></div>`);
      o.querySelector('.sheet').style.maxWidth = '640px';
    };
    app.querySelectorAll('[data-pb]').forEach(i => i.onchange = () => api('/api/platform/restaurants/' + i.dataset.pb, { method: 'PUT', body: { poweredBy: i.checked } }).then(() => toast('Saved')));
  }
  api('/api/platform/restaurants').then(list, () => {});
})();
</script>
</body>
</html>
